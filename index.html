<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Awards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #141414; }
    </style>
</head>
<body class="text-white font-sans selection:bg-red-600 selection:text-white pb-12">
    <nav class="flex flex-wrap items-center justify-between px-6 py-4 bg-gradient-to-b from-black to-transparent fixed w-full z-50">
        <div class="flex items-center space-x-4 mb-2 md:mb-0">
            <img src="MS_brain.png" alt="Mind Stretcher Logo" class="h-10 object-contain">
            <h1 class="text-red-600 text-2xl font-black tracking-wider">D&D AWARDS</h1>
        </div>
        <div class="flex space-x-4 text-sm font-semibold">
            <button onclick="switchView('voter')" id="btn-voter" class="text-white hover:text-gray-300 transition">Voter</button>
            <button onclick="switchView('live')" id="btn-live" class="text-gray-400 hover:text-white transition">Live Screen</button>
            <button onclick="switchView('admin')" id="btn-admin" class="text-gray-400 hover:text-white transition">Admin</button>
        </div>
    </nav>

    <main class="pt-28 px-4 md:px-8">
        <section id="view-voter" class="block">
            <h2 class="text-2xl font-bold mb-8 text-red-600 uppercase tracking-widest">Trending Candidates</h2>
            <div id="voter-categories"></div>
        </section>

        <section id="view-live" class="hidden">
            <div class="flex flex-col md:flex-row min-h-[70vh]">
                <div class="w-full md:w-2/3 p-4 md:p-8 md:border-r border-zinc-800">
                    <h2 class="text-4xl font-bold mb-8 text-red-600 uppercase tracking-widest">Live Leaderboard</h2>
                    <div id="live-leaderboard" class="space-y-6"></div>
                </div>
                <div class="w-full md:w-1/3 p-8 flex flex-col items-center justify-center">
                    <h3 class="text-2xl font-bold mb-6 text-center">Scan to Vote</h3>
                    <div class="w-64 h-64 bg-white p-4 rounded-lg flex items-center justify-center">
                        <img id="qr-code" src="" alt="QR Code" class="w-full h-full object-contain">
                    </div>
                    <p class="mt-6 text-gray-400 text-center text-sm">Join the WiFi and scan to participate</p>
                </div>
            </div>
        </section>

        <section id="view-admin" class="hidden max-w-3xl mx-auto">
            <h2 class="text-2xl font-bold mb-6 text-red-600 uppercase tracking-widest">Admin Control Panel</h2>
            <div class="bg-zinc-900 p-6 rounded-lg mb-8">
                <h3 class="text-xl font-semibold mb-4">Add Shortlisted Candidate</h3>
                <form id="add-candidate-form" class="space-y-4" onsubmit="addCandidate(event)">
                    <input type="text" id="candidate-name" required placeholder="Candidate Name" class="w-full p-3 bg-zinc-800 rounded text-white border border-zinc-700 focus:border-red-600 outline-none">
                    <select id="candidate-category" class="w-full p-3 bg-zinc-800 rounded text-white border border-zinc-700 outline-none">
                        <option value="Best Dressed Male">Best Dressed Male</option>
                        <option value="Best Dressed Female">Best Dressed Female</option>
                        <option value="Best Dressed Group">Best Dressed Group</option>
                    </select>

                    <div class="relative border-2 border-dashed border-zinc-700 p-6 text-center rounded text-gray-400 hover:border-red-600 transition cursor-pointer">
                        <input type="file" id="candidate-photo" accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewImage(event)">
                        <span id="upload-text">Click to upload photo</span>
                        <img id="image-preview" src="" class="hidden mx-auto h-32 object-cover mt-2 rounded">
                    </div>

                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded transition">Add to Roster</button>
                    <button type="button" onclick="clearData()" class="w-full bg-zinc-800 hover:bg-red-900 text-gray-400 font-bold py-2 rounded transition mt-4">Reset All Data & Votes</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const defaultCandidates = [];
        let candidates = JSON.parse(localStorage.getItem('dd_candidates')) || defaultCandidates;
        const categories = ['Best Dressed Male', 'Best Dressed Female', 'Best Dressed Group'];
        let uploadedImageBase64 = '';

        document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(window.location.href)}`;

        function switchView(viewName) {
            ['voter', 'live', 'admin'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
                document.getElementById(`btn-${v}`).classList.remove('text-white');
                document.getElementById(`btn-${v}`).classList.add('text-gray-400');
            });
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            document.getElementById(`btn-${viewName}`).classList.remove('text-gray-400');
            document.getElementById(`btn-${viewName}`).classList.add('text-white');
            if (viewName === 'voter') renderVoter();
            if (viewName === 'live') renderLive();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('image-preview').src = uploadedImageBase64;
                    document.getElementById('image-preview').classList.remove('hidden');
                    document.getElementById('upload-text').innerText = 'Photo Selected';
                };
                reader.readAsDataURL(file);
            }
        }

        function addCandidate(event) {
            event.preventDefault();
            const name = document.getElementById('candidate-name').value;
            const category = document.getElementById('candidate-category').value;
            candidates.push({ id: Date.now(), name, category, image: uploadedImageBase64, votes: 0 });
            saveData();
            document.getElementById('add-candidate-form').reset();
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('upload-text').innerText = 'Click to upload photo';
            alert(`${name} added successfully!`);
        }

        function castVote(id) {
            const candidate = candidates.find(c => c.id === id);
            if (candidate) {
                candidate.votes += 1;
                saveData();
                renderVoter();
                alert(`Vote cast for ${candidate.name}!`);
            }
        }

        function saveData() {
            localStorage.setItem('dd_candidates', JSON.stringify(candidates));
        }

        function clearData() {
            if (confirm('Are you sure you want to delete all candidates and votes?')) {
                candidates = [];
                saveData();
                alert('All data cleared.');
            }
        }

        function renderVoter() {
            const container = document.getElementById('voter-categories');
            container.innerHTML = '';

            categories.forEach(cat => {
                const catCandidates = candidates.filter(c => c.category === cat);
                if (catCandidates.length === 0) return;

                const cardsHtml = catCandidates.map(c => `
                    <div class="min-w-[160px] md:min-w-[220px] bg-zinc-900 rounded-md overflow-hidden hover:scale-105 transition duration-300 flex-shrink-0 cursor-pointer group">
                        <div class="relative">
                            <img src="${c.image}" alt="${c.name}" class="w-full h-56 md:h-72 object-cover opacity-80 group-hover:opacity-100 transition">
                            <div class="absolute bottom-0 w-full bg-gradient-to-t from-black to-transparent p-3 pt-12">
                                <p class="font-bold text-lg text-white shadow-black drop-shadow-md">${c.name}</p>
                            </div>
                        </div>
                        <button onclick="castVote(${c.id})" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 text-sm font-bold tracking-widest transition">VOTE</button>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="mb-10">
                        <h3 class="text-xl font-bold mb-4 border-l-4 border-red-600 pl-3 text-gray-200">${cat}</h3>
                        <div class="flex overflow-x-auto space-x-4 pb-4 hide-scroll">${cardsHtml}</div>
                    </div>
                `;
            });

            if (candidates.length === 0) {
                container.innerHTML = '<p class="text-gray-500">No candidates added yet. Go to Admin to add some.</p>';
            }
        }

        function renderLive() {
            const container = document.getElementById('live-leaderboard');
            container.innerHTML = '';

            categories.forEach(cat => {
                const catCandidates = candidates.filter(c => c.category === cat);
                if (catCandidates.length === 0) return;

                const topCandidate = catCandidates.sort((a, b) => b.votes - a.votes)[0];

                container.innerHTML += `
                    <div class="bg-zinc-900/80 p-6 rounded-lg flex items-center justify-between border-l-4 border-red-600 shadow-2xl">
                        <div class="flex items-center space-x-6">
                            <img src="${topCandidate.image}" class="w-20 h-20 rounded-full object-cover border-2 border-zinc-700">
                            <div>
                                <h3 class="text-red-600 text-xs font-bold uppercase tracking-widest mb-1">${cat}</h3>
                                <p class="text-3xl font-black text-white">${topCandidate.name}</p>
                            </div>
                        </div>
                        <div class="text-center">
                            <div class="text-5xl font-black text-white">${topCandidate.votes}</div>
                            <div class="text-xs text-red-600 font-bold uppercase tracking-wider mt-1">Votes</div>
                        </div>
                    </div>
                `;
            });
        }

        renderVoter();

        setInterval(() => {
            if (!document.getElementById('view-live').classList.contains('hidden')) {
                candidates = JSON.parse(localStorage.getItem('dd_candidates')) || [];
                renderLive();
            }
        }, 3000);
    </script>
</body>
</html>
